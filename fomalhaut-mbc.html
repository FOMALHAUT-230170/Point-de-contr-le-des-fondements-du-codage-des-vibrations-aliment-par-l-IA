<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FOMALHAUT.MBC</title>
  <meta name="description" content="FOMALHAUT.MBC — portfolio et projets." />
  <meta property="og:title" content="FOMALHAUT.MBC" />
  <meta property="og:description" content="FOMALHAUT.MBC — portfolio et projets." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --background: oklch(0.23 0.07 255);
      --foreground: oklch(0.99 0.005 250);
      --primary: oklch(0.97 0.008 250);
      --primary-foreground: oklch(0.23 0.07 255);
      --muted-foreground: oklch(0.86 0.03 250);
      --border: oklch(1 0 0 / 14%);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border-color: var(--border);
    }
    a, button, .hoverable {
      cursor: pointer;
    }
    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: "Manrope", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 72rem;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.5rem;
    }
    .brand {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.5rem;
      letter-spacing: -0.025em;
      cursor: pointer;
    }
    nav {
      display: flex;
      gap: 2rem;
      font-size: 0.875rem;
      color: var(--muted-foreground);
    }
    nav span {
      cursor: pointer;
      transition: color 0.2s;
    }
    nav span:hover {
      color: var(--foreground);
    }
    main {
      display: flex;
      flex: 1;
      align-items: center;
    }
    section {
      max-width: 56rem;
      margin: 0 auto;
      padding: 6rem 1.5rem;
      text-align: center;
    }
    .kicker {
      margin-bottom: 1.5rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--primary);
    }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-size: 4.5rem;
      line-height: 1.1;
      font-weight: 600;
    }
    .subtitle {
      margin: 1.5rem auto 0;
      max-width: 36rem;
      font-size: 1.125rem;
      color: var(--muted-foreground);
    }
    .cta {
      margin-top: 2.5rem;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 9999px;
      background-color: var(--primary);
      color: var(--primary-foreground);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .cta:hover {
      opacity: 0.9;
    }
    @media (max-width: 768px) {
      h1 { font-size: 3rem; }
      nav { gap: 1rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="header-inner">
        <span class="brand">FOMALHAUT.MBC</span>
        <nav>
          <span>Accueil</span>
          <span>À propos</span>
          <span>Contact</span>
        </nav>
      </div>
    </header>
    <main>
      <section>
        <p class="kicker">Bienvenue</p>
        <h1>FOMALHAUT.MBC</h1>
        <p class="subtitle">Portfolio de projets, idées et réalisations.</p>
        <button class="cta">Voir mes Projets</button>
      </section>
    </main>
  </div>
</body>
</html>
